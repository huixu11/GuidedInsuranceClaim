name: docker

# Builds the image exactly as the README describes, runs it, and walks the demo test case
# through all four SOP phases over HTTP. No model API key is needed: the container is run in
# offline mode (SOP_LLM_MODE=mock) and, separately, in model mode with no key at all. The load
# test (scripts/load_test.py) then runs against one offline container, and against two
# containers that share a SQLite session store on a volume, every conversation alternating
# between them.
#
# The test suite runs with a real PostgreSQL next to it, so the store tests cover all three
# stores, and the failover test (scripts/failover_test.py) kills one of three instances in the
# middle of a run, on SQLite and on PostgreSQL. The last job starts docker-compose.ha.yml (three
# instances behind a load balancer on PostgreSQL), kills a container mid-run and starts it again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build the image and run it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build the image
        run: docker build -t sop-agent .

      - name: Image contents
        run: |
          docker image inspect sop-agent --format 'size: {{.Size}} bytes | user: {{.Config.User}}'
          docker run --rm sop-agent python --version
          docker run --rm sop-agent pip list --format=freeze --disable-pip-version-check
          # Only the application and its requirements file belong in the image:
          # no tests, no scripts, no .env.
          docker run --rm sop-agent ls -A /app
          test "$(docker run --rm sop-agent ls -A /app | sort | tr '\n' ' ')" = "insurance_claims requirements.txt "

      - name: Start a container in offline mode
        run: docker run -d --name sop-offline -p 8000:8000 -e SOP_LLM_MODE=mock sop-agent

      - name: Wait for the image's own HEALTHCHECK to report healthy
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' sop-offline)
            echo "$(date +%T) health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 3
          done
          docker logs sop-offline
          exit 1

      - name: Runs as the non-root user
        run: |
          docker exec sop-offline id
          test "$(docker exec sop-offline id -un)" = "appuser"
          test "$(docker exec sop-offline id -u)" = "10001"

      - name: Demo test case through the published port
        run: python3 scripts/docker_smoke.py http://127.0.0.1:8000

      - name: Every requirement of the brief, one by one
        run: python3 scripts/spec_check.py http://127.0.0.1:8000

      - name: Load test against the offline container (every conversation checked)
        run: python3 scripts/load_test.py http://127.0.0.1:8000 --callers 300 --concurrency 60

      - name: Start a container in model mode without a key
        run: |
          docker run -d --name sop-nokey -p 8001:8000 sop-agent
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/healthz > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs sop-nokey
          exit 1

      - name: A missing key is reported cleanly
        run: python3 scripts/docker_smoke.py http://127.0.0.1:8001 --no-key

      - name: Start a container in auto mode without a key (the hosted demo's configuration)
        run: |
          docker run -d --name sop-auto -p 8003:8000 -e SOP_LLM_MODE=auto sop-agent
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8003/healthz > /dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs sop-auto
          exit 1

      - name: Auto mode answers offline when nobody supplies a key
        run: python3 scripts/spec_check.py http://127.0.0.1:8003

      - name: Start two containers that share one SQLite session store (one runs two workers)
        run: |
          docker volume create sop-sessions
          docker run -d --name sop-shared-a -p 8004:8000 -v sop-sessions:/data \
            -e SOP_LLM_MODE=mock -e SOP_SESSION_STORE=/data/sessions.db sop-agent
          docker run -d --name sop-shared-b -p 8005:8000 -v sop-sessions:/data \
            -e SOP_LLM_MODE=mock -e SOP_SESSION_STORE=/data/sessions.db -e SOP_WORKERS=2 sop-agent
          for port in 8004 8005; do
            up=""
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:$port/healthz" > /dev/null 2>&1; then up=1; break; fi
              sleep 1
            done
            if [ -z "$up" ]; then docker logs sop-shared-a; docker logs sop-shared-b; exit 1; fi
          done

      - name: Load test across both containers (each conversation alternates between them)
        run: python3 scripts/load_test.py http://127.0.0.1:8004 http://127.0.0.1:8005 --callers 400 --concurrency 100

      - name: The in-memory store refuses several workers
        run: |
          set +e
          out=$(timeout 60 docker run --name sop-refused -e SOP_WORKERS=2 sop-agent 2>&1)
          code=$?
          set -e
          docker rm -f sop-refused > /dev/null 2>&1 || true
          echo "$out"
          test "$code" = 2
          echo "$out" | grep -q "SOP_SESSION_STORE=sqlite"

      - name: docker compose builds, starts and serves the same workflow
        env:
          SOP_LLM_MODE: mock
          PORT: "8002"
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/healthz > /dev/null 2>&1; then break; fi
            sleep 1
          done
          python3 scripts/docker_smoke.py http://127.0.0.1:8002
          docker compose down

      - name: Container logs
        if: always()
        run: |
          echo "--- offline mode ---"; docker logs sop-offline || true
          echo "--- model mode, no key ---"; docker logs sop-nokey || true
          echo "--- auto mode, no key ---"; docker logs sop-auto || true
          echo "--- shared store, container A ---"; docker logs sop-shared-a || true
          echo "--- shared store, container B (two workers) ---"; docker logs sop-shared-b || true

  tests:
    name: Test suite on the image's Python, with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # A throwaway database of this job; nothing else can reach it.
      PG_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - name: pytest inside python:3.14-slim (memory, SQLite and PostgreSQL stores)
        run: |
          docker run --rm --network host -v "$PWD":/src -w /src -e PYTHONDONTWRITEBYTECODE=1 \
            -e SOP_TEST_POSTGRES_URL="$PG_URL" python:3.14-slim \
            sh -c "pip install --no-cache-dir --quiet --root-user-action=ignore -r requirements-dev.txt && python -m pytest -q -p no:cacheprovider -rs"

      - name: Failover on SQLite (one of three instances is killed mid-run and comes back)
        run: |
          docker run --rm --network host -v "$PWD":/src -w /src -e PYTHONDONTWRITEBYTECODE=1 python:3.14-slim \
            sh -c "pip install --no-cache-dir --quiet --root-user-action=ignore -r requirements.txt && python -u scripts/failover_test.py"

      - name: Failover on PostgreSQL (one of three instances is killed mid-run and comes back)
        run: |
          docker run --rm --network host -v "$PWD":/src -w /src -e PYTHONDONTWRITEBYTECODE=1 python:3.14-slim \
            sh -c "pip install --no-cache-dir --quiet --root-user-action=ignore -r requirements.txt && python -u scripts/failover_test.py --store '$PG_URL'"

  ha:
    name: Three instances behind a load balancer on PostgreSQL; one is killed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOP_LLM_MODE: mock
      PORT: "8080"
      LB: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL, three instances and the load balancer
        run: docker compose -f docker-compose.ha.yml up --build -d --wait --wait-timeout 240

      - name: Every instance is ready and uses the one database
        run: |
          cat > /tmp/check_instance.py <<'EOF'
          import json, urllib.request
          ready = json.load(urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=5))
          store = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/stats", timeout=5))["store"]
          print(ready, store["kind"], "shared" if store["shared_between_processes"] else "not shared")
          assert ready.get("status") == "ready" and store["kind"] == "postgres" and store["shared_between_processes"]
          EOF
          for app in app1 app2 app3; do
            echo "--- $app"
            docker compose -f docker-compose.ha.yml exec -T "$app" python - < /tmp/check_instance.py
          done

      - name: Every requirement of the brief, through the load balancer
        run: python3 scripts/spec_check.py "$LB"

      - name: Load test through the load balancer (every conversation checked)
        run: python3 scripts/load_test.py "$LB" --callers 300 --concurrency 60

      - name: Kill one instance in the middle of a run, start it again; nothing is lost or doubled
        env:
          # The instances are re-created with a slower offline double, so that turns are in flight
          # when one dies, and a shorter lease, so that what it held is free again quickly.
          SOP_MOCK_LATENCY_MS: "350"
          SOP_TURN_LEASE_SECONDS: "6"
        run: |
          docker compose -f docker-compose.ha.yml up -d --wait --wait-timeout 240
          python3 -u scripts/failover_test.py --urls "$LB" --lease 6 \
            --kill-cmd "docker kill sop-ha-app2-1" --restart-cmd "docker start sop-ha-app2-1"

      - name: The restarted instance is ready again and the load balancer still serves
        run: |
          for i in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' sop-ha-app2-1)
            echo "$(date +%T) app2: $health"
            if [ "$health" = "healthy" ]; then break; fi
            sleep 2
          done
          test "$health" = "healthy"
          docker compose -f docker-compose.ha.yml ps
          python3 scripts/spec_check.py "$LB"

      - name: The database goes away and comes back; the instances recover without a restart
        run: |
          docker compose -f docker-compose.ha.yml stop db
          sleep 3
          code=$(curl -s -o /tmp/down.json -w '%{http_code}' -X POST "$LB/api/sessions" -H 'Content-Type: application/json' -d '{}' || true)
          echo "new conversation while the database is down: HTTP $code $(cat /tmp/down.json 2>/dev/null)"
          test "$code" = 503 -o "$code" = 502
          docker compose -f docker-compose.ha.yml start db
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$LB/readyz" || true)
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          echo "ready again after the database came back: HTTP $code"
          test "$code" = 200
          docker compose -f docker-compose.ha.yml ps
          python3 scripts/spec_check.py "$LB"

      - name: Logs
        if: always()
        run: docker compose -f docker-compose.ha.yml logs --no-color --tail 200
