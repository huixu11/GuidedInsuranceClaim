# Render Blueprint: a hosted copy of the demo, built from the Dockerfile in this repository.
#
#   Render Dashboard -> New -> Blueprint -> Connect this repository -> Deploy Blueprint
#
# SOP_LLM_MODE=auto: without a key the offline double answers (fixed replies, no model calls),
# which is enough to click through the whole workflow; a tester who saves their own Anthropic API
# key in the UI's Settings dialog gets the live model, with that key, for their own requests.
# No key is stored on the server, so the hosted demo cannot spend anyone else's credit.
# The README section "Hosted demo" has the details and the limits of the free plan.
services:
  - type: web
    name: sop-claims-agent
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SOP_LLM_MODE
        value: auto
      # The image listens on this port (HOST is already 0.0.0.0 in the Dockerfile).
      - key: PORT
        value: "8000"
      # The free instance has 512 MB of memory and one small CPU share: keep what it holds well
      # inside that. The defaults (50,000 conversations or 1 GB of state) suit a larger machine.
      # One process, conversations in memory; see the README, "Scaling and limits".
      - key: SOP_MAX_SESSIONS
        value: "20000"
      - key: SOP_MAX_STORE_MB
        value: "128"
